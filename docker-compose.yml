services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders_products
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    ports:
      - "5010:5010"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5010
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: orders_products
      JWT_SECRET: your-secret-key
      FRONTEND_URL: https://inventory-management.pp.ua

  frontend:
    build: ./frontend
    ports:
      - "3010:3010"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: https://inventory-management.pp.ua/api
      NEXT_PUBLIC_SOCKET_URL: https://inventory-management.pp.ua

volumes:
  mysql_data:
